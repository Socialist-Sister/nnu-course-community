server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 20.2.136.131;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 308 https://20.2.136.131$request_uri; }
}
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name 20.2.136.131;
    ssl_certificate /etc/letsencrypt/live/nnu-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nnu-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 24k;
    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;
    gzip_min_length 1000;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    location ~ /\. { deny all; }
    location / {
        proxy_pass http://127.0.0.1:4180;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
